name: Update portfolio data

on:
  schedule:
    - cron: "5 * * * *"   # 每小時第 5 分執行一次
  workflow_dispatch: {}    # 也可以在 Actions 分頁手動按 "Run workflow"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: node scripts/fetch-data.mjs

      - name: Commit data.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "chore: update portfolio data"
          git push
